<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ختمة قرآن كريم</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f4f4f9; padding: 20px; color: #333; }
        .card { background: white; max-width: 500px; margin: 0 auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 22px; }
        p { font-size: 16px; color: #555; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .juz-btn { padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .juz-btn.taken { background: #e74c3c; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="card">
        <h1>ختمة قرآن كريم</h1>
        <p>صدقة جارية عن روح المرحوم خالنا العزيز</p>
        <p>اختر الجزء الذي ترغب بقراءته:</p>
        <div class="grid" id="juzContainer"></div>
    </div>

    <script>
        const container = document.getElementById('juzContainer');
        for (let i = 1; i <= 30; i++) {
            const btn = document.createElement('button');
            btn.className = 'juz-btn';
            btn.innerText = 'الجزء ' + i;
            btn.onclick = function() {
                alert('تقبل الله طاعتكم، تم حجز الجزء ' + i);
                btn.classList.add('taken');
                btn.innerText = 'الجزء ' + i + ' (محجوز)';
            };
            container.appendChild(btn);
        }
    </script>
</body>
</html>
